# Automated release: every push to master runs the full test gate, then
# publishes a GitHub Release for the version in ytpipeline/__init__.py if
# that version has not been released yet.
#
# Normal flow: bump VERSION in ytpipeline/__init__.py, commit, push master.
# The gate (tests + build, via ci.yml) must be green, or nothing releases.
# A push without a version bump is a no-op beyond the tests.
name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# Serialize publish runs: a second push must re-check "already released"
# after the first one finishes, not race it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    name: quality gate (tests)
    uses: ./.github/workflows/ci.yml

  publish:
    name: build + publish
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # full history: the changelog lists commits since the previous release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build the executable
        run: make build

      - name: Publish the release if the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "== releases only publish from master (got $GITHUB_REF); skipping."
            exit 0
          fi
          VERSION=$(python3 -c "from ytpipeline import VERSION; print(VERSION)")
          TAG="v$VERSION"
          echo "== yt-pipeline $VERSION -> $TAG"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "== $TAG is already released; nothing to do."
            exit 0
          fi

          SHA256=$(sha256sum dist/yt-pipeline | cut -d' ' -f1)
          WORK=$(mktemp -d)
          sed -e "s/{{VERSION}}/$VERSION/g" -e "s|{{SHA256}}|$SHA256|g" \
              .github/release-notes-template.md > "$WORK/notes.md"

          PREV=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1 \
                   --json tagName --jq '.[0].tagName' 2> /dev/null || true)
          if [ -n "${PREV:-}" ]; then
            echo "== appending commit log since $PREV"
            printf '\n\n## Changes since %s\n\n' "$PREV" >> "$WORK/notes.md"
            git log --no-merges --pretty='* %s (%h)' "$PREV..HEAD" >> "$WORK/notes.md"
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$PREV" "$TAG" >> "$WORK/notes.md"
          fi

          gh release create "$TAG" dist/yt-pipeline \
            -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "yt-pipeline $VERSION" \
            --notes-file "$WORK/notes.md"
          echo "== released $TAG (asset: yt-pipeline, sha256 $SHA256)"
